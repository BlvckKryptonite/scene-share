# fly.toml app configuration file generated by `flyctl launch`
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "sceneshare"
primary_region = "iad"

[env]
  DJANGO_SETTINGS_MODULE = "sceneshare.settings"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[checks]
  [checks.alive]
    type = "http"
    interval = "10s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/"
    port = 8080

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
